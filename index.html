        else { $('#otherDesc').value = ''; op.otherDesc = ''; }
      }
      update();
    }
    const t = e.target.closest('[data-to]');
    if (t){
      op.to_box_id = t.dataset.to;
      body.querySelectorAll('[data-to]').forEach(x=>x.setAttribute('aria-pressed', x===t));
      // نطوي القائمة الطويلة ونُظهر المبلغ مباشرة أمام عين المستخدم
      const target = S.targets.find(b => b.box_id === op.to_box_id) || {};
      $('#toList').classList.add('hidden');
      const picked = $('#toPicked');
      picked.classList.remove('hidden');
      picked.innerHTML = `<span class="row-ic tr">${ic('box')}</span>
        <span class="row-main"><b>${esc(target.name || '')}</b><small>${esc(target.location || '')}</small></span>
        <button type="button" class="link" data-change-to>تغيير</button>`;
      update();
      setTimeout(() => { const a = $('#stepAmount'); if (a) a.scrollIntoView({ behavior:'smooth', block:'center' }); }, 80);
    }
    if (e.target.closest('[data-change-to]')){
      op.to_box_id = '';
      $('#toList').classList.remove('hidden');
      $('#toPicked').classList.add('hidden');
      body.querySelectorAll('[data-to]').forEach(x=>x.setAttribute('aria-pressed', false));
      update();
    }
    const s = e.target.closest('#unc');
    if (s){ op.unconfirmed = !op.unconfirmed; s.setAttribute('aria-checked', op.unconfirmed); }
    const cur = e.target.closest('[data-kp-cur]');
    if (cur){ const list = S.me.currencies || ['DZD']; op.currency = list[(list.indexOf(op.currency)+1)%list.length]; if (op.currency==='DZD') op.value = op.value.split('.')[0]; op.paint(); }
  });
  bindKeypad(body, op, update);
  foot.querySelector('#opSave').addEventListener('click', () => submitOp(op, box));
  update();
}

async function submitOp(op, box){
  const btn = $('#opSave'); setBtnBusy(btn, true);
  const amount = Number(op.value);
  op._ref = op._ref || newRef();
  try {
    let r, title, note, amber = false;
    if (op.type === 'income'){
      r = await api('recordIncome', { box_id:box.box_id, amount, currency:op.currency, counterparty:op.counterparty.trim(), description:op.description.trim(), unconfirmed:op.unconfirmed, entry_date:op.date , client_ref: op._ref });
      title = 'تم حفظ الاستلام'; note = `من ${op.counterparty.trim()}`;
    } else if (op.type === 'expense'){
      const desc = (op.needsDesc ? String(op.otherDesc||'') : op.description).trim();
      r = await api('recordExpense', { box_id:box.box_id, amount, currency:op.currency, category_id:op.category_id, description:desc, entry_date:op.date , client_ref: op._ref });
      title = 'تم حفظ المصروف';
      note = op.needsDesc ? desc : S.cats.find(c=>c.category_id===op.category_id).name;
    } else {
      r = await api('createTransfer', { from_box_id:box.box_id, to_box_id:op.to_box_id, amount, currency:op.currency, via:op.via.trim(), description:op.description.trim(), entry_date:op.date , client_ref: op._ref });
      const to = S.targets.find(b=>b.box_id===op.to_box_id).name;
      title = 'أُرسل التحويل'; note = `بانتظار تأكيد ${to}`; amber = true;
    }
    op._ref = null;
    if (r && r.queued){
      const verb = op.type==='income' ? 'استلام مبلغ' : op.type==='expense' ? 'مصروف' : 'تحويل';
      return queuedSheet(verb + ' محفوظ دون اتصال', op.counterparty || op.description || '', amount);
    }
    const newBal = r.balance ? r.balance[op.currency] : null;
    const warn = (r.warnings||[])[0];
    openSheet(`<div class="sheet-body"><div class="success">
        <div class="check ${amber?'amber':''}">${amber?`<svg class="i" viewBox="0 0 24 24">${I.clock}</svg>`:`<svg class="i" viewBox="0 0 24 24">${I.check}</svg>`}</div>
        <h3>${title}</h3><p>${esc(note)}</p>
        <div class="big">${money(amount, op.currency)}</div>
        ${newBal!=null&&!amber?`<span class="after">رصيد الصندوق الآن <b class="num">${newBal<0?'−':''}${fmt(newBal)}</b></span>`:''}
        ${warn?`<p class="hint warn" style="margin-top:10px">${esc(warn)}</p>`:''}
      </div></div>
      <div class="sheet-foot" style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1" data-act="op" data-type="${op.type}">عملية أخرى</button>
        <button class="btn btn-primary" style="flex:1" data-act="close-sheet">تم</button></div>`);
    refresh(true);
  } catch(x){ setBtnBusy(btn, false); toast(x.message, true); }
}

    case 'pw-toggle': { const inp = el.closest('.pw-wrap').querySelector('input');

});

  KEEPER:     { t:'صاحب صندوق', d:'يسجّل ويرى صناديقه فقط' },
  ACCOUNTANT: { t:'محاسب', d:'يرى كل الصناديق، يثبّت ويلغي القيود' },
  ADMIN:      { t:'مدير', d:'كل شيء، بما فيه المستخدمون والصناديق' }
};

function showFormErr(form, m){
  let box = $('.form-err', form);
  if (!box){ box = document.createElement('div'); box.className = 'form-err'; form.insertBefore(box, $('.field', form)); }
  box.textContent = m;
}

function copyText(v){
  const done = () => toast('نُسخ');
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(v).then(done).catch(() => fallback());
  fallback();
  function fallback(){ const t = document.createElement('textarea'); t.value = v; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(_){ toast('تعذّر النسخ، انسخها يدوياً', true); } t.remove(); }
}
function waPhone(p){
  const s = String(p||'').replace(/[^\d]/g,'');
  if (!s) return '';
  if (s.startsWith('213')) return s;
  if (s.startsWith('0')) return '213' + s.slice(1);
  return s;
}
const TRANSLIT = { 'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'t','ج':'dj','ح':'h','خ':'kh','د':'d','ذ':'d','ر':'r','ز':'z','س':'s','ش':'ch','ص':'s','ض':'d','ط':'t','ظ':'d','ع':'a','غ':'gh','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'ou','ي':'i','ى':'a','ئ':'i','ؤ':'ou','ء':'' };
function suggestUsername(name){
  const words = String(name||'').trim().split(/\s+/).filter(Boolean).slice(0,2);
  const t = words.map(w => [...w].map(c => TRANSLIT[c] ?? (/[a-z0-9]/i.test(c) ? c.toLowerCase() : '')).join('').replace(/(.)\1{2,}/g,'$1$1'));
  return t.filter(Boolean).join('.').slice(0, 24);
}

function bindUserForm(sh, f, u){
  const edit = !!u, q = s => sh.querySelector(s);
  const show = (el, on) => { if (!el) return; if (on && el.classList.contains('hidden')) { el.classList.remove('hidden'); el.classList.add('reveal'); } else if (!on) el.classList.add('hidden'); };
  const update = () => {
    const nameOk = f.full_name.trim().length >= 2;
    const roleOk = !!f.role;
    if (!edit) { show(q('#uf-s-role'), nameOk); show(q('#uf-s-boxes'), nameOk && roleOk); }
    const keeper = f.role === 'KEEPER';
    q('#uf-boxes-l').innerHTML = keeper ? 'الصناديق التي يمسكها' : 'صناديق يمسكها بنفسه <small>(اختياري)</small>';
    const nbOk = !f.new_box || f.nb_name.trim().length >= 2;
    const boxesOk = (!keeper || f.box_ids.size > 0 || f.new_box) && nbOk;
    if (!edit) show(q('#uf-s-login'), nameOk && roleOk && boxesOk);
    const userOk = edit || /^[a-z0-9_.]{3,30}$/.test(f.username);
    const ok = nameOk && roleOk && boxesOk && userOk;
    const btn = q('#uf-save');
    btn.disabled = !ok;
    btn.textContent = ok ? (edit ? 'حفظ التغييرات' : `إضافة ${f.full_name.trim()}`)
      : keeper && nameOk && !boxesOk ? 'اختر صندوقاً واحداً على الأقل' : 'أكمل البيانات';
  };
  sh.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'uf-name') {
      f.full_name = e.target.value;
      if (!edit && !f.touched) { f.username = suggestUsername(f.full_name); q('#uf-user').value = f.username; }
      if (!edit && f.new_box && !f.nbTouched) { f.nb_name = f.full_name; q('#uf-nbname').value = f.nb_name; }
    }
    if (id === 'uf-phone') f.phone = e.target.value;
    if (id === 'uf-user') { f.touched = true; e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_.]/g,''); f.username = e.target.value; }
    if (id === 'uf-nbname') { f.nbTouched = true; f.nb_name = e.target.value; }
    if (id === 'uf-nbloc') f.nb_location = e.target.value;
    update();
  });
  sh.addEventListener('click', e => {
    const r = e.target.closest('[data-role]');
    if (r && !r.disabled) { f.role = r.dataset.role; sh.querySelectorAll('[data-role]').forEach(x => x.setAttribute('aria-pressed', x === r)); update(); }
    const b = e.target.closest('[data-box]');
    if (b) { const id = b.dataset.box; f.box_ids.has(id) ? f.box_ids.delete(id) : f.box_ids.add(id); b.setAttribute('aria-pressed', f.box_ids.has(id)); update(); }
    const nb = e.target.closest('[data-newbox]');
    if (nb) {
      f.new_box = !f.new_box; nb.setAttribute('aria-pressed', f.new_box); show(q('#uf-nb'), f.new_box);
      if (f.new_box && !f.nb_name) { f.nb_name = f.full_name.trim(); q('#uf-nbname').value = f.nb_name; }
      update();
    }
    const t = e.target.closest('[data-nbtype]');
    if (t) { f.nb_type = t.dataset.nbtype; sh.querySelectorAll('[data-nbtype]').forEach(x => x.setAttribute('aria-pressed', x === t)); }
    if (e.target.closest('#uf-save')) saveUserForm(f, u);
  });
  update();
}

async function saveUserForm(f, u){
  const btn = $('#uf-save'); if (btn.disabled) return; setBtnBusy(btn, true);
  try {
    if (u) {
      const payload = { user_id:u.user_id, full_name:f.full_name.trim(), phone:f.phone.trim(), box_ids:[...f.box_ids] };
      if (f.role !== u.role) payload.role = f.role;
      await api('adminUpdateUser', payload);
      closeSheet(); toast('تم حفظ التغييرات'); afterAdminChange();
    } else {
      const akey = 'adminCreateUser:' + (f.username || '');
      const r = await api('adminCreateUser', { client_ref: refFor(akey),
        full_name:f.full_name.trim(), phone:f.phone.trim(), role:f.role, username:f.username, box_ids:[...f.box_ids],
        new_box: f.new_box ? { name:f.nb_name.trim(), type:f.nb_type, location:f.nb_location.trim() } : null
      });
      clearRef(akey); openCreds(r, 'new'); afterAdminChange();
    }
  } catch(x){ setBtnBusy(btn, false); toast(x.message, true); }
}

function viewAdminBoxes(){
  const head = adminHead('الصناديق', 'adm-box-new', 'صندوق جديد');
  if (!S.adm.loaded) return head + `<div class="page" style="padding-top:8px"><div class="sk" style="height:280px;border-radius:14px"></div></div>`;
  const boxes = S.adm.boxes.slice().sort((a,b) => (a.status === b.status ? 0 : a.status === 'ACTIVE' ? -1 : 1) || a.name.localeCompare(b.name, 'ar'));
  const total = boxes.filter(b => b.status === 'ACTIVE').reduce((s,b) => s + (b.balances.DZD || 0), 0);
  const noOpening = boxes.filter(b => b.status === 'ACTIVE' && !b.has_opening_dzd).length;
  return head + `<div class="page" style="padding-top:8px">
    <div class="card" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span class="hint" style="margin:0">مجموع الصناديق النشطة</span><span class="amt" style="font-size:17px">${total<0?'−':''}${fmt(total)} دج</span></div>
    ${noOpening ? `<div class="t-note" style="margin:0 0 12px">${noOpening} صندوق بدون رصيد افتتاحي. أدخله من تفاصيل الصندوق عند نقل الأرصدة من الإكسل.</div>` : ''}
    <div class="list">${boxes.map(boxRow).join('')}</div>
  </div>`;
}
function boxRow(b){
  const off = b.status !== 'ACTIVE', dzd = b.balances.DZD || 0;
  const keepers = b.keeper_user_ids.map(k => (admUser(k)||{}).full_name).filter(Boolean);
  return `<button class="row" data-act="adm-box" data-id="${b.box_id}">
    <span class="row-ic ${off?'void':'tr'}">${ic('box')}</span>
    <span class="row-main"><span class="row-title">${esc(b.name)}</span>
      <span class="row-sub"><span>${keepers.length ? esc(keepers.join('، ')) : 'بدون صاحب'}</span>${b.location ? `<span>${esc(b.location)}</span>` : ''}</span></span>
    <span class="row-end"><span class="amt" style="${dzd<0?'color:var(--out)':''}">${dzd<0?'−':''}${fmt(dzd)}</span>
      ${off ? '<span class="tag grey">موقوف</span>' : !b.has_opening_dzd ? '<span class="row-bal">بلا رصيد افتتاحي</span>' : ''}</span>
  </button>`;
}

  </div>
  <div class="sheet-foot"><button class="btn btn-primary btn-block" id="bf-save">${edit ? 'حفظ التغييرات' : 'إضافة الصندوق'}</button></div>`,
  { full:true, onMount: sh => {
    const btn = sh.querySelector('#bf-save');
    const upd = () => { btn.disabled = f.name.trim().length < 2; };
    sh.addEventListener('input', e => { if (e.target.id === 'bf-name') f.name = e.target.value; if (e.target.id === 'bf-loc') f.location = e.target.value; upd(); });
    sh.addEventListener('click', async e => {
      const t = e.target.closest('[data-bftype]');
      if (t) { f.type = t.dataset.bftype; sh.querySelectorAll('[data-bftype]').forEach(x => x.setAttribute('aria-pressed', x === t)); }
      const k = e.target.closest('[data-keeper]');
      if (k) { const id = k.dataset.keeper; f.keepers.has(id) ? f.keepers.delete(id) : f.keepers.add(id); k.setAttribute('aria-pressed', f.keepers.has(id)); }
      if (e.target.closest('#bf-save') && !btn.disabled) {
        setBtnBusy(btn, true);
        try {
          if (edit) await api('updateBox', { box_id:b.box_id, name:f.name.trim(), location:f.location.trim(), keeper_user_ids:[...f.keepers] });
          else await api('createBox', { name:f.name.trim(), type:f.type, location:f.location.trim(), keeper_user_ids:[...f.keepers] });

        } catch(x){ setBtnBusy(btn, false); toast(x.message, true); }
      }
    });
    upd();
  }});
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { copyText(c.dataset.copy); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'adm-users': S.view = 'admin-users'; renderShell(false); window.scrollTo(0,0); break;
    case 'adm-boxes': S.view = 'admin-boxes'; renderShell(false); window.scrollTo(0,0); break;
    case 'adm-user': openUserDetail(id); break;
    case 'adm-user-new': openUserForm(); break;
    case 'adm-user-edit': openUserForm(id); break;
    case 'adm-reset': openReset(id); break;
    case 'adm-reset-go': doReset(id, el); break;
    case 'adm-user-disable': openDisable(id); break;
    case 'adm-disable-go': setUserStatus(id, 'DISABLED', el); break;
    case 'adm-user-enable': setUserStatus(id, 'ACTIVE', el); break;
    case 'adm-box': openBoxDetail(id); break;
    case 'adm-box-new': openBoxForm(); break;
    case 'adm-box-edit': openBoxForm(id); break;
    case 'adm-opening': openOpening(id); break;
    case 'adm-box-disable': setBoxStatus(id, 'DISABLED', el); break;
    case 'adm-box-enable': setBoxStatus(id, 'ACTIVE', el); break;
    case 'adm-copy-msg': copyText(S._credMsg); break;
    case 'demo-go': {
      S.demo = true; localStorage.setItem(LS.demo, '1');
      S.token = id === 'admin' ? 'demo-admin' : 'demo'; localStorage.setItem(LS.token, S.token);
      closeSheet(true); loadApp(); break;
    }
  }
});

      if (p.box_ids) boxes.forEach(b => { const has = b.k.includes(u.user_id), want = p.box_ids.includes(b.box_id); if (has && !want) b.k = b.k.filter(k=>k!==u.user_id); if (!has && want) b.k.push(u.user_id); });
      Object.assign(u, { role, status }, p.full_name !== undefined ? { full_name:p.full_name } : {}, p.phone !== undefined ? { phone:p.phone } : {});
      return { user:userView(u) };
    },
    adminResetPassword: p => { requireAdmin(); const u = users.find(x => x.user_id === p.user_id); u.must_change_password = true; return { user:userView(u), username:u.username, temp_password:tempPw() }; },
    createBox: p => { requireAdmin(); if (boxes.some(b=>b.name===p.name)) err('يوجد صندوق بنفس الاسم'); const b = { box_id:'B'+(boxes.length+10), name:p.name, type:p.type, location:p.location, k:p.keeper_user_ids||[], status:'ACTIVE' }; boxes.push(b); return b; },
    updateBox: p => { requireAdmin(); const b = box(p.box_id);
      if (p.status === 'DISABLED' && Object.keys(bal(b.box_id)).length) err('لا يمكن إيقاف صندوق رصيده ليس صفراً');
      if (p.name !== undefined) b.name = p.name; if (p.location !== undefined) b.location = p.location;
      if (p.keeper_user_ids) b.k = p.keeper_user_ids.slice(); if (p.status) b.status = p.status; return b; },
    recordOpening: p => { requireAdmin(); if (hasOpening(p.box_id)) err('يوجد رصيد افتتاحي لهذا الصندوق');
      add({ box_id:p.box_id, entry_date:p.entry_date, created_at:now(), direction:p.amount>0?'IN':'OUT', amount:Math.abs(p.amount), currency:'DZD', entry_type:'OPENING' }); return { balance:bal(p.box_id) }; }
  };
  function back(p, st){ const t=T.find(x=>x.transfer_id===p.transfer_id);
    add({ box_id:t.from_box_id, entry_date:localDate(new Date()), created_at:now(), direction:'IN', amount:t.amount, currency:t.currency, entry_type:'TRANSFER_RETURN', counterparty:box(t.to_box_id).name, transfer_id:t.transfer_id });
    Object.assign(t, { status:st, response_note:p.note||'' }); return { transfer:desc(t) }; }
  return { handle: (action, p, token) => new Promise((res, rej) => setTimeout(() => {
    cur = token === 'demo-admin' ? 'U2' : 'U1';
    try { if (!H[action]) err('غير متاح في وضع التجربة'); res(H[action](p||{})); } catch(x){ rej(x); }
  }, 380)) };
})();


boot();

/* عامل الخدمة: يجعل التطبيق يُثبَّت كأيقونة ويفتح بدون إنترنت.
   التحديث يبقى فورياً لأن الشبكة لها الأولوية دائماً. */
if ('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller){
            sw.postMessage('skipWaiting');   // نسخة جديدة جاهزة
          }
        });
      });
      setInterval(() => reg.update(), 60 * 60 * 1000);
    }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return; reloading = true; location.reload();
    });
  });
}
</script>
